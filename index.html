<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 col-md-6 col-xxl-3">1</div>
            <div class="col-12 col-md-6 col-xxl-3">2</div>
            <div class="col-12 col-md-6 col-xxl-3">3</div>
            <div class="col-12 col-md-6 col-xxl-3">4</div>
        </div>
    </div>

    <div class="text-center">
    <img src="pngtree-3d-illustration-of-coffee-cup-and-beans-image_3722286.jpg" width="900" height="500" class="rounded img-fluid" alt="Responsive image">
    <figcaption class="figure-caption text-end">dddddddddd</figcaption>
    </div>

    <div class="container pt-3">
        <div class="form-switch">
            <input class="form-check-input" type="checkbox" value="" role="switch" id="flexCheckDefault">
            <label class="form-check-label" for="flexCheckDefault">
                Default switch checkbox input
            </label>
        </div>
        <div class="form-checks">
            <input class="form-check-input" type="checkbox" value="" id="flexCheckChecked1">
            <label class="form-check-label" for="flexCheckChecked1">
                Checked checkbox
            </label>
        </div>
        <div class="form-checks">
            <input class="form-check-input" type="radio" value="" name="radioDefault" id="flexCheckChecked2">
            <label class="form-check-label" for="flexCheckChecked2">
                Checked radio button
            </label>
        </div>
        <div class="form-checks">
            <input class="form-check-input" type="radio" value="" name="radioDefault" id="flexCheckChecked3">
            <label class="form-check-label" for="flexCheckChecked3">
                Checked radio button
            </label>
        </div>
    </div>

    <table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">First</th>
      <th scope="col">Last</th>
      <th scope="col">Handle</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">1</th>
      <td>Mark</td>
      <td>Otto</td>
      <td>@mdo</td>
    </tr>
    <tr>
      <th scope="row">2</th>
      <td>Jacob</td>
      <td>Thornton</td>
      <td>@fat</td>
    </tr>
    <tr>
      <th scope="row">3</th>
      <td>John</td>
      <td>Doe</td>
      <td>@social</td>
    </tr>
  </tbody>
</table>

<input type="checkbox" class="btn-check" id="btn-check" autocomplete="off">
<label class="btn btn-primary" for="btn-check">Single toggle</label>

<input type="checkbox" class="btn-check" id="btn-check-2" checked autocomplete="off">
<label class="btn btn-primary" for="btn-check-2">Checked</label>

<input type="checkbox" class="btn-check" id="btn-check-3" autocomplete="off" disabled>
<label class="btn btn-primary" for="btn-check-3">Disabled</label>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
